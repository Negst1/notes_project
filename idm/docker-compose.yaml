version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: idm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: idm
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - idm-network

  app:
    build: .
    container_name: idm-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: idm
      APP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/root/logs 
    networks:
      - idm-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: idm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@idm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - idm-network

volumes:
  postgres_data:

networks:
  idm-network:
    driver: bridge