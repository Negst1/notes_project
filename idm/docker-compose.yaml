version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: idm-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: idm
    ports:
      - "5433:5432" 
    volumes:
      - idm_postgres_data:/var/lib/postgresql/data  
      - ./migrations:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-network 

  app:
    build: .
    container_name: idm-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: idm
      APP_PORT: 8080
      NOTES_SERVICE_URL: http://notes-app:8080 
    ports:
      - "8081:8080"
    volumes:
      - ./logs:/root/logs 
    networks:
      - app-network
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: idm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@idm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - app-network  # ИЗМЕНИЛ: общая сеть

volumes:
  idm_postgres_data:  # ИЗМЕНИЛ: уникальное имя

networks:
  app-network:  # ИЗМЕНИЛ: внешняя сеть для обоих сервисов
    external: true
    name: app-network