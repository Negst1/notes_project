version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: notes-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notes
    ports:
      - "5434:5432"  # ИЗМЕНИЛ: 5434 вместо 6432
    volumes:
      - notes_postgres_data:/var/lib/postgresql/data  # ИЗМЕНИЛ: уникальное имя
      - ./migrations:/docker-entrypoint-initdb.d/
    healthcheck:  # ДОБАВИЛ
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - app-network  # ИЗМЕНИЛ: общая сеть

  app:
    build: .
    container_name: notes-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: notes
      APP_PORT: 8080
      IDM_SERVICE_URL: http://idm-app:8080  # Добавил для связи
    ports:
      - "8082:8080"  # ИЗМЕНИЛ: 8082 вместо 6060
    volumes:
      - ./logs:/root/logs 
    networks:
      - app-network  # ИЗМЕНИЛ: общая сеть
    restart: unless-stopped

volumes:
  notes_postgres_data:  # ИЗМЕНИЛ: уникальное имя

networks:
  app-network:  # ИЗМЕНИЛ: внешняя сеть
    external: true
    name: app-network